# Build the latest portfolio and deploy it to GitHub Pages.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, and cancel in-progress ones
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build and publish the same app used by the local preview.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scrollcraft/builds/shengyao-v4/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: scrollcraft/builds/shengyao-v4
        run: npm ci
      - name: Build latest portfolio
        working-directory: scrollcraft/builds/shengyao-v4
        run: npm run build
      - name: Preserve existing public pages and links
        run: |
          cp privacypolicy.html robots.txt sitemap.xml google*.html scrollcraft/builds/shengyao-v4/dist/
          cp -r assets/. scrollcraft/builds/shengyao-v4/dist/assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scrollcraft/builds/shengyao-v4/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
