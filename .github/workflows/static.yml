# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, and cancel in-progress ones
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Collect only the published site files into _site/ so we don't upload
      # node_modules, scrollcraft builds, docs, tmp, etc. (the old "path: ."
      # uploaded the whole 400+ MB repo and timed out).
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp favicon.ico _site/ 2>/dev/null || true
          cp privacypolicy.html _site/ 2>/dev/null || true
          cp robots.txt _site/ 2>/dev/null || true
          cp sitemap.xml _site/ 2>/dev/null || true
          cp google*.html _site/ 2>/dev/null || true
          cp -r assets _site/assets
          cp -r media _site/media
          echo "---- _site contents ----"
          ls -la _site
          du -sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
