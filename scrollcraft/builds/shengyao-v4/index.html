    <meta name="description" content="Siew Sheng Yao, Microsoft Certified Power BI Data Analyst (PL-300). I turn company data into Power BI dashboards that leaders use. Available full-time from March 2027." />
    <meta property="og:title" content="ShengYao · Power BI Data Analyst" />

    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try { if (localStorage.getItem("sy-theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
      try { var l = localStorage.getItem("sy-lang"); if (l === "zh") document.documentElement.lang = "zh-CN"; else if (l === "ms") document.documentElement.lang = "ms"; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;600;800&display=swap" rel="stylesheet" />
